server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    # L¡mite m ximo de subida alineado con PHP
    client_max_body_size 64M;

    # Oculta el n£mero de versi¢n de nginx en las cabeceras HTTP
    server_tokens off;

    # Cabeceras de seguridad contra clickjacking y MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Bloqueo estricto de xmlrpc y del archivo de credenciales wp-config
    location = /xmlrpc.php { deny all; }
    location = /wp-config.php { deny all; }

    # Impide la ejecuci¢n de archivos PHP dentro del directorio de medios
    location ~* ^/wp-content/uploads/.*\.php$ { deny all; }

    # Enrutamiento para URLs amigables de WordPress
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Procesamiento FastCGI hacia el contenedor de PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
