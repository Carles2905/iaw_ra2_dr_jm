server {
    # Puerto en el que escucha el servidor Nginx dentro del contenedor
    listen 80;

    # Nombre del servidor (acepta cualquier dominio o IP local)
    server_name _;

    # Directorio ra¡z donde residen los ficheros de WordPress compartidos
    root /var/www/html;

    # Fichero ¡ndice preferente al cargar el directorio
    index index.php;

    # Tama¤o m ximo permitido para subir archivos (plugins, temas, fotos)
    client_max_body_size 64M;

    # Regla de enrutamiento principal para URLs amigables de WordPress
    location / {
        # Comprueba si el recurso solicitado existe; si no, lo env¡a a index.php
        try_files $uri $uri/ /index.php?$args;
    }

    # Bloque para procesar peticiones a ficheros PHP deleg ndolas a PHP-FPM
    location ~ \.php$ {
        # Incluye los par metros est ndar de comunicaci¢n FastCGI
        include fastcgi_params;

        # Reenv¡a la petici¢n al servicio wordpress por su puerto FastCGI 9000
        fastcgi_pass wordpress:9000;

        # Define la ruta absoluta del script PHP que debe ejecutarse
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
